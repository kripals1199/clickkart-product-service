# CI for clickkart-product-service.
#
# Runs on every push and pull request. This is the build that actually gates the repo - the
# Jenkinsfile in the repo root describes the full deploy pipeline (image push, Trivy scan,
# environment rollout) but requires a Jenkins server, container registry and kubectl contexts
# that only exist in a real deployment environment.
#
# 'mvn verify' - not 'mvn test' - so the jacoco coverage gate in pom.xml is genuinely enforced.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build, test and enforce coverage gate
        run: mvn -B verify

      - name: Publish test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Publish coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Build only - no push. Publishing to a registry belongs to the Jenkins pipeline, which
      # holds the registry credentials; this step exists to catch a broken Dockerfile at PR time
      # rather than at deploy time.
      - name: Build image
        run: docker build -t clickkart/product-service:ci .
